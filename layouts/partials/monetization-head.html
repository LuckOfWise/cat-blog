{{- /*
  Inject AdSense and GA4 scripts in <head> when corresponding params are set.
  Both stay inert if site.Params.* is empty (フェーズ2で有効化).
*/ -}}
{{- with site.Params.adsense_publisher_id -}}
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client={{ . }}" crossorigin="anonymous"></script>
{{- end -}}
{{- with site.Params.google_analytics_id -}}
<script async src="https://www.googletagmanager.com/gtag/js?id={{ . }}"></script>
<script>
window.dataLayer = window.dataLayer || [];
function gtag(){dataLayer.push(arguments);}
gtag('js', new Date());
// Explicit QA visits can be inspected in DebugView and excluded by GA4's developer filter.
var analyticsConfig = {};
if (new URLSearchParams(window.location.search).get('analytics_debug') === '1') {
  analyticsConfig.debug_mode = true;
}
gtag('config', '{{ . }}', analyticsConfig);
</script>
{{- end -}}
